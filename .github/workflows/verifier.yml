name: vérifier

# Le cœur de Ndank est pur et sans dépendance : la suite tourne en une seconde
# et ne demande ni base ni réseau. Il n'y avait donc aucune raison de la laisser
# dépendre de qui pense à la lancer.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` et non `npm install` : le verrou existe pour que deux machines
      # installent la même chose, et `ci` est ce qui le respecte.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Le schéma du niveau 2. `validate` résout `env("DATABASE_URL")` avant
      # d'analyser, d'où cette URL factice : rien ne s'y connecte, mais sans
      # elle la validation échoue sur la variable plutôt que sur le schéma.
      - run: npm run schema
        env:
          DATABASE_URL: postgresql://ndank:ndank@localhost:5432/ndank

      # La construction, et surtout l'épreuve d'installation qui suit.
      #
      # Un paquet peut compiler, passer tous ses tests, et rester
      # inutilisable : un chemin d'export qui pointe à côté, un format que
      # l'hôte ne sait pas charger, un fichier oublié dans `files`. Aucun de
      # ces trois défauts ne se voit dans le dépôt — ils se voient chez celui
      # qui installe, après publication.
      - run: npm run build

      # `npm pack` puis installation réelle dans un projet vide, en ESM et en
      # CommonJS. C'est la seule vérification qui parle du paquet plutôt que
      # de la source.
      - run: node scripts/epreuve-paquet.mjs
